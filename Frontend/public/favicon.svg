  <!-- Cloche tray -->
  <rect x="103" y="244" width="306" height="25" rx="12.5" fill="url(#gold)" stroke="#c88c18" stroke-width="5"/>

  <!-- Gloved hand -->
  <path d="M135 370
           C147 345 166 326 190 311
