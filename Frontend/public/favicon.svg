<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#123b78"/>
      <stop offset="100%" stop-color="#06152f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0a0"/>
      <stop offset="35%" stop-color="#ffd34f"/>
      <stop offset="70%" stop-color="#d99616"/>
      <stop offset="100%" stop-color="#fff0a0"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dce5f5"/>
    </linearGradient>
  </defs>

  <!-- Circular app icon -->
  <circle cx="256" cy="256" r="246" fill="url(#bg)" stroke="url(#gold)" stroke-width="20"/>

  <!-- Sparkles -->
  <path d="M105 130 C105 150 98 157 78 157 C98 157 105 164 105 184 C105 164 112 157 132 157 C112 157 105 150 105 130Z" fill="#ffd34f"/>
  <path d="M145 180 C145 192 141 196 129 196 C141 196 145 200 145 212 C145 200 149 196 161 196 C149 196 145 192 145 180Z" fill="#ffd34f"/>

  <!-- Cloche knob -->
  <circle cx="256" cy="91" r="25" fill="url(#gold)"/>
  <rect x="246" y="111" width="20" height="20" rx="9" fill="url(#gold)"/>

  <!-- Cloche dome -->
  <path d="M130 244
           C142 174 190 132 256 132
           C322 132 370 174 382 244
           Z"
        fill="url(#gold)" stroke="#c88c18" stroke-width="7"/>

  <!-- Cloche highlight -->
  <path d="M302 157 C340 174 354 202 360 229"
