           C214 333 201 342 190 351
           C213 345 238 337 260 323
           L303 286
           C313 278 324 281 327 291
           C330 300 324 308 316 316
           L287 344
           L330 307
           C340 298 351 300 355 309
           C358 317 353 326 345 334
           L314 363
           L351 336
           C361 329 372 332 376 341
           C380 350 374 358 366 365
           C335 391 305 410 270 421
           C231 433 195 429 165 412
           Z"
        fill="url(#hand)" stroke="#b9c6da" stroke-width="5" stroke-linejoin="round"/>

  <!-- Sleeve -->
  <path d="M72 417 L139 366 L170 412 L105 458 Z"
        fill="#102b55" stroke="#07172f" stroke-width="6"/>
  <path d="M126 379 L157 365 L174 403 L143 418 Z"
